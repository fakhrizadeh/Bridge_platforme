<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">نمای آزمایشی فرایند فروش بریج</title><desc id="desc">موکاپ فارسی CRM با داده‌های ساختگی</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="13" flood-opacity=".08"/></filter><style>.t{font-family:Tahoma,Arial,sans-serif;fill:#18191c}.m{fill:#777b85}.sm{font-size:15px}.md{font-size:18px}.lg{font-size:22px;font-weight:700}.b{font-weight:700}.line{stroke:#e8e9ed}.card{fill:#fff;stroke:#e1e2e6}.accent{fill:#ff6b16}</style></defs>
  <rect width="1600" height="820" fill="#f7f7f8"/><rect width="1600" height="72" fill="#fff"/><line x2="1600" y1="72" y2="72" class="line"/>
  <rect x="1530" y="15" width="42" height="42" rx="12" fill="#202126"/><path d="M1543 44h9V28h8v7h-8" fill="none" stroke="#fff" stroke-width="3"/><text x="1506" y="42" text-anchor="end" class="t md b">بریج / نرم‌افزار فروش</text>
  <rect x="500" y="16" width="520" height="40" rx="12" class="card"/><text x="760" y="42" text-anchor="middle" class="m sm">جست‌وجو و دسترسی سریع به همه داده‌ها ...</text>
  <rect x="1138" y="92" width="400" height="696" rx="22" class="card" filter="url(#s)"/><text x="1494" y="138" text-anchor="end" class="t lg">مشتریان</text><rect x="1172" y="110" width="140" height="46" rx="12" fill="#202126"/><text x="1242" y="140" text-anchor="middle" fill="#fff" class="md b">+ مشتری جدید</text>
  <rect x="1172" y="178" width="332" height="44" rx="12" class="card"/><text x="1338" y="206" text-anchor="middle" class="m sm">جست‌وجوی نام یا شماره آزمایشی</text><rect x="1394" y="273" width="110" height="4" rx="2" class="accent"/><text x="1478" y="258" text-anchor="end" class="t md b">کارهای من</text><text x="1490" y="324" text-anchor="end" class="m md">مشتری‌ای با این فیلتر یافت نشد</text>
