  <text x="350" y="140" text-anchor="end" class="t lg">اطلاعات مشتری</text><text x="350" y="200" text-anchor="end" class="m sm">نام و نام خانوادگی</text><rect x="58" y="216" width="302" height="48" rx="12" class="card"/><text x="338" y="247" text-anchor="end" class="t md">کاربر آزمایشی ۱</text><text x="350" y="310" text-anchor="end" class="m sm">شماره تماس</text><rect x="58" y="326" width="302" height="48" rx="12" class="card"/><text x="338" y="357" text-anchor="end" class="t md">۰۹۱۲•••۱۲۳۴</text><text x="350" y="420" text-anchor="end" class="m sm">شرکت</text><rect x="58" y="436" width="302" height="48" rx="12" class="card"/><text x="338" y="467" text-anchor="end" class="m md">شرکت نمونه</text><rect x="58" y="710" width="302" height="52" rx="14" fill="#24252a"/><text x="209" y="743" text-anchor="middle" fill="#fff" class="md b">به‌روزرسانی</text>
