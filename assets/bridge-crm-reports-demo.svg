<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">نمای آزمایشی گزارش‌های مدیریتی بریج</title><desc id="desc">موکاپ گزارش CRM با داده‌های کاملاً ساختگی</desc>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity=".07"/></filter><style>.t{font-family:Tahoma,Arial,sans-serif;fill:#18191c}.m{fill:#737783}.sm{font-size:14px}.md{font-size:17px}.lg{font-size:22px;font-weight:700}.b{font-weight:700}.line{stroke:#e6e7eb}.card{fill:#fff;stroke:#e0e1e5}.accent{fill:#ff6b16}</style></defs>
  <rect width="1600" height="820" fill="#f7f7f8"/><rect width="1600" height="72" fill="#fff"/><line x2="1600" y1="72" y2="72" class="line"/><rect x="1530" y="15" width="42" height="42" rx="12" fill="#202126"/><path d="M1543 44h9V28h8v7h-8" fill="none" stroke="#fff" stroke-width="3"/><text x="1506" y="42" text-anchor="end" class="t md b">بریج / نرم‌افزار فروش</text><rect x="500" y="16" width="520" height="40" rx="12" class="card"/><text x="760" y="42" text-anchor="middle" class="m sm">جست‌وجو و دسترسی سریع به همه داده‌ها ...</text>
  <rect x="1138" y="92" width="400" height="696" rx="22" class="card" filter="url(#s)"/><text x="1494" y="138" text-anchor="end" class="t lg">گزارش‌های مدیران</text><rect x="1172" y="110" width="140" height="46" rx="12" fill="#202126"/><text x="1242" y="140" text-anchor="middle" fill="#fff" class="md b">+ گزارش جدید</text><rect x="1172" y="178" width="332" height="44" rx="12" class="card"/><text x="1338" y="206" text-anchor="middle" class="m sm">جست‌وجوی گزارش ...</text><text x="1478" y="258" text-anchor="end" class="t md b">مشتریان</text><text x="1320" y="258" text-anchor="end" class="m md">فعالیت‌ها</text><rect x="1394" y="273" width="110" height="4" rx="2" class="accent"/>
  <g transform="translate(1174 304)"><rect width="330" height="116" rx="14" fill="#fafafa"/><text x="308" y="30" text-anchor="end" class="t md b">آخرین مراجعه</text><text x="308" y="60" text-anchor="end" class="m sm">گزارش نمونه · همه مشتریان</text><rect x="214" y="76" width="94" height="28" rx="9" class="card"/><text x="261" y="96" text-anchor="middle" class="t sm">ویرایش</text></g>
  <g transform="translate(1174 438)"><rect width="330" height="116" rx="14" fill="#fafafa"/><text x="308" y="30" text-anchor="end" class="t md b">پیگیری‌های باز</text><text x="308" y="60" text-anchor="end" class="m sm">فیلتر: این هفته</text><rect x="214" y="76" width="94" height="28" rx="9" class="card"/><text x="261" y="96" text-anchor="middle" class="t sm">ویرایش</text></g>
  <g transform="translate(1174 572)"><rect width="330" height="116" rx="14" fill="#fafafa"/><text x="308" y="30" text-anchor="end" class="t md b">فرصت‌های داغ</text><text x="308" y="60" text-anchor="end" class="m sm">سطح مشتری: ۴ و ۵ ستاره</text><rect x="214" y="76" width="94" height="28" rx="9" class="card"/><text x="261" y="96" text-anchor="middle" class="t sm">ویرایش</text></g>
  <rect x="28" y="92" width="1088" height="696" rx="22" class="card"/>
  <text x="1072" y="140" text-anchor="end" class="t lg">گزارش مشتریان</text><text x="1072" y="172" text-anchor="end" class="m sm">آخرین مراجعه · داده‌های نمونه</text><rect x="64" y="112" width="126" height="40" rx="11" fill="#24252a"/><text x="127" y="138" text-anchor="middle" fill="#fff" class="md b">دریافت خروجی</text>
  <g transform="translate(62 204)"><rect width="1018" height="52" rx="13" fill="#f6f6f7"/><text x="988" y="33" text-anchor="end" class="t md b">تمام مدت</text><text x="850" y="33" text-anchor="end" class="m md">ماه جاری</text><text x="700" y="33" text-anchor="end" class="m md">هفته جاری</text><rect x="250" y="7" width="230" height="38" rx="10" class="card"/><text x="365" y="32" text-anchor="middle" class="m sm">جست‌وجو کنید</text></g>
  <g transform="translate(62 278)">
