    <g class="t sm">
      <g transform="translate(0 58)"><rect width="1018" height="72" fill="#fff"/><text x="985" y="43" text-anchor="end" class="b">کاربر آزمایشی ۱</text><text x="810" y="43" text-anchor="end">تیم فروش</text><text x="650" y="43" text-anchor="end">۰۹۱۲•••۱۲۳۴</text><text x="472" y="43" text-anchor="end">شخص</text><text x="315" y="43" text-anchor="end">فروردین</text><text x="132" y="43" text-anchor="end" fill="#ff6b16">۵ ستاره</text></g>
      <g transform="translate(0 130)"><rect width="1018" height="72" fill="#fcfcfc"/><text x="985" y="43" text-anchor="end" class="b">کاربر آزمایشی ۲</text><text x="810" y="43" text-anchor="end">تیم فروش</text><text x="650" y="43" text-anchor="end">۰۹۱۹•••۵۶۷۸</text><text x="472" y="43" text-anchor="end">شرکت</text><text x="315" y="43" text-anchor="end">تیر</text><text x="132" y="43" text-anchor="end" fill="#ff6b16">۴ ستاره</text></g>
      <g transform="translate(0 202)"><rect width="1018" height="72" fill="#fff"/><text x="985" y="43" text-anchor="end" class="b">کاربر آزمایشی ۳</text><text x="810" y="43" text-anchor="end">تیم فروش</text><text x="650" y="43" text-anchor="end">۰۹۳۵•••۹۰۱۲</text><text x="472" y="43" text-anchor="end">شخص</text><text x="315" y="43" text-anchor="end">مهر</text><text x="132" y="43" text-anchor="end" fill="#ff6b16">۳ ستاره</text></g>
      <g transform="translate(0 274)"><rect width="1018" height="72" fill="#fcfcfc"/><text x="985" y="43" text-anchor="end" class="b">شرکت نمونه</text><text x="810" y="43" text-anchor="end">واحد سازمانی</text><text x="650" y="43" text-anchor="end">۰۲۱•••۴۵۶۷</text><text x="472" y="43" text-anchor="end">شرکت</text><text x="315" y="43" text-anchor="end">آبان</text><text x="132" y="43" text-anchor="end" fill="#ff6b16">۴ ستاره</text></g>
    </g>
    <line x1="0" y1="58" x2="1018" y2="58" class="line"/><line x1="0" y1="130" x2="1018" y2="130" class="line"/><line x1="0" y1="202" x2="1018" y2="202" class="line"/><line x1="0" y1="274" x2="1018" y2="274" class="line"/><line x1="0" y1="346" x2="1018" y2="346" class="line"/>
  </g>
  <rect x="390" y="690" width="430" height="64" rx="18" class="card" filter="url(#s)"/><text x="785" y="729" text-anchor="end" class="m sm">نمایش ۲۰ مورد · صفحه ۱ از ۳</text><rect x="422" y="703" width="42" height="38" rx="10" fill="#24252a"/><text x="443" y="728" text-anchor="middle" fill="#fff" class="md b">۱</text><rect x="474" y="703" width="42" height="38" rx="10" class="card"/><text x="495" y="728" text-anchor="middle" class="t md">۲</text>
